<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk-to-Me (500m Live-Funk)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #start-btn { padding: 20px 40px; font-size: 20px; font-weight: bold; background: #22c55e; color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 20px; box-shadow: 0 0 20px #22c55e; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; }
        .status-dot { width: 15px; height: 15px; background: #ef4444; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-dot.active { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        #log { margin-top: 20px; font-size: 13px; color: #94a3b8; text-align: left; height: 180px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h2>500m Live-Funkgerät</h2>
        <p style="margin-top: 10px; color: #aaa;">Tippe auf Start für direkte Tonverbindung</p>
        <button id="start-btn" onclick="initApp()">FUNK STARTEN</button>
    </div>

    <div class="card">
        <h2><span id="dot" class="status-dot"></span> Raum-Funk</h2>
        <p id="status-text" style="margin-top: 10px; font-size: 14px;">Warte auf Start...</p>
        <div id="log"></div>
    </div>

    <div id="audioContainer"></div>

    <script>
        let peer = null;
        let localStream = null;

        // Eindeutige IDs für Gerät 1 (Master) und Gerät 2 (Client)
        // Das erste Gerät wird automatisch zum Raum-Host
        const ROOM_HOST_ID = "talktome-live-room-host";
        const MY_RANDOM_ID = "peer_" + Math.floor(Math.random() * 90000 + 10000);

        async function initApp() {
            document.getElementById("start-overlay").style.display = "none";
            log("Starte Mikrofon...");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                    video: false 
                });
                log("Mikrofon bereit.");

                // Versuch 1: Versuche der Master-Host zu werden
                peer = new Peer(ROOM_HOST_ID);

                peer.on('open', (id) => {
                    log("🟢 Du bist der Raum-Host (Warte auf andere)...");
                    document.getElementById("dot").classList.add("active");
                    document.getElementById("status-text").innerText = "Dauerhaft LIVE (Host)";
                });

                // Falls ID schon vergeben ist (weil Gerät 1 schon online ist), schalte auf Client um
                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        log("Raum-Host gefunden. Verbinde...");
                        connectAsClient();
                    } else {
                        log("Fehler: " + err);
                    }
                });

                // Eingehende Anrufe empfangen (wenn andere dich anrufen)
                peer.on('call', (call) => {
                    log("🔊 Eingehender Anruf! Antworte...");
                    call.answer(localStream);
                    
                    call.on('stream', (remoteStream) => {
                        playAudio(call.peer, remoteStream);
                    });
                });

            } catch (err) {
                log("Mikrofon-Fehler: " + err);
            }
        }

        function connectAsClient() {
            // Mit eigener ID neu starten und den Host anrufen
            peer = new Peer(MY_RANDOM_ID);

            peer.on('open', (id) => {
                log("Verbunden als Teilhaber.");
                document.getElementById("dot").classList.add("active");
                document.getElementById("status-text").innerText = "Dauerhaft LIVE (Client)";

                log("Rufe Raum-Host an...");
                const call = peer.call(ROOM_HOST_ID, localStream);

                call.on('stream', (remoteStream) => {
                    playAudio(ROOM_HOST_ID, remoteStream);
                });
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    playAudio(call.peer, remoteStream);
                });
            });
        }

        function playAudio(peerId, stream) {
            log("🔊 AUDIO LIVE VERBUNDEN!");
            let audio = document.getElementById("audio_" + peerId);
            if (!audio) {
                audio = document.createElement("audio");
                audio.id = "audio_" + peerId;
                audio.autoplay = true;
                audio.setAttribute("playsinline", "true");
                document.getElementById("audioContainer").appendChild(audio);
            }
            audio.srcObject = stream;
            audio.play().catch(e => log("Klicke 1x ins Bild für Ton."));
        }

        function log(msg) {
            const l = document.getElementById("log");
            l.innerHTML += `<div>> ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }
    </script>
</body>
</html>
