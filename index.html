<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talk to Me</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: rgba(22, 30, 46, 0.7);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.4);
            --active-red: #ef4444;
            --active-glow: rgba(239, 68, 68, 0.5);
            --status-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px 16px;
            overflow: hidden;
        }

        header {
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        .status-container, .radar-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-secondary);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .status-dot.online {
            background-color: var(--status-green);
            box-shadow: 0 0 8px var(--status-green);
        }

        .status-dot.active {
            background-color: var(--active-red);
            box-shadow: 0 0 10px var(--active-red);
            animation: blink 1s infinite alternate;
        }

        .radar-icon {
            width: 14px;
            height: 14px;
            fill: var(--accent-cyan);
        }

        .status-text, .radar-text {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .radar-count {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex: 1;
        }

        .talk-btn-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pulse-ring {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 2px solid var(--accent-cyan);
            opacity: 0;
            pointer-events: none;
        }

        .talk-btn-wrapper.active .pulse-ring {
            border-color: var(--active-red);
            animation: pulse-wave 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .talk-btn-wrapper.active .pulse-ring:nth-child(2) {
            animation-delay: 0.6s;
        }

        .talk-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: none;
            outline: none;
            background: linear-gradient(145deg, #131b2e, #0b101d);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .talk-btn svg {
            width: 48px;
            height: 48px;
            fill: var(--text-secondary);
            transition: fill 0.3s ease, transform 0.3s ease;
        }

        .talk-btn span {
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .talk-btn:active {
            transform: scale(0.95);
        }

        .talk-btn-wrapper.active .talk-btn {
            background: linear-gradient(145deg, #1f1015, #2b090a);
            box-shadow: 0 0 30px var(--active-glow),
                        inset 0 0 15px var(--active-glow);
        }

        .talk-btn-wrapper.active .talk-btn svg {
            fill: var(--active-red);
            transform: scale(1.1);
        }

        .talk-btn-wrapper.active .talk-btn span {
            color: var(--active-red);
        }

        footer {
            margin-bottom: 10px;
            text-align: center;
        }

        footer p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        @keyframes pulse-wave {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <header>
        <h1>TALK TO ME</h1>
        
        <div class="info-bar">
            <div class="status-container">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">Bereit</span>
            </div>

            <div class="radar-container">
                <svg class="radar-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
                </svg>
                <span class="radar-text"><span class="radar-count" id="nearbyCount">0</span> in 500m</span>
            </div>
        </div>
    </header>

    <main>
        <div class="talk-btn-wrapper" id="btnWrapper">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <button class="talk-btn" id="talkBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                <span id="btnLabel">VERBINDEN</span>
            </button>
        </div>
    </main>

    <footer>
        <p>Echtzeit Cloud Audio-Funkverbindung</p>
    </footer>

    <script>
        const RENDER_WEBSOCKET_URL = "wss://talk-to-me-spcc.onrender.com/ws";

        const talkBtn = document.getElementById('talkBtn');
        const btnWrapper = document.getElementById('btnWrapper');
        const btnLabel = document.getElementById('btnLabel');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const nearbyCount = document.getElementById('nearbyCount');

        let isConnected = false;
        let mediaStream = null;
        let socket = null;
        let audioContext = null;
        let audioProcessor = null;
        let micSource = null;
        let nextPlayTime = 0;

        // Entsperrt das Audio-System des Handys
        function unlockAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // WebSocket-Verbindung herstellen
        function connectToServer() {
            socket = new WebSocket(RENDER_WEBSOCKET_URL);
            socket.binaryType = "arraybuffer";

            socket.onopen = () => {
                console.log("WebSocket verbunden!");
                sendLocation();
                startPCMStreaming();
            };

            socket.onmessage = async (event) => {
                if (typeof event.data === "string") {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'nearby_count') {
                            nearbyCount.textContent = data.count;
                        }
                    } catch (e) {
                        console.error("JSON Fehler:", e);
                    }
                } else if (event.data instanceof ArrayBuffer) {
                    playIncomingPCM(event.data);
                }
            };

            socket.onerror = (err) => {
                console.error("WebSocket Fehler:", err);
                statusText.textContent = "Server-Fehler";
            };

            socket.onclose = () => {
                if (isConnected) disconnect();
            };
        }

        // Standort an den Server senden
        function sendLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const gpsData = {
                        type: 'location',
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude
                    };
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify(gpsData));
                    }
                }, (err) => {
                    console.warn("GPS nicht verfügbar:", err);
                }, { enableHighAccuracy: true });
            }
        }

        // 🎙️ Nimmt Mikrofon-Audio auf & sendet es (OHNE lokales Echo)
        function startPCMStreaming() {
            if (!mediaStream || !audioContext) return;

            micSource = audioContext.createMediaStreamSource(mediaStream);
            audioProcessor = audioContext.createScriptProcessor(2048, 1, 1);

            audioProcessor.onaudioprocess = (e) => {
                if (!isConnected || !socket || socket.readyState !== WebSocket.OPEN) return;

                const inputBuffer = e.inputBuffer.getChannelData(0);
                
                // Konvertierung Float32 zu Int16
                const pcm16 = new Int16Array(inputBuffer.length);
                for (let i = 0; i < inputBuffer.length; i++) {
                    let s = Math.max(-1, Math.min(1, inputBuffer[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                // Paket erstellen (Abtastrate + Audio)
                const packet = new ArrayBuffer(4 + pcm16.length * 2);
                const view = new DataView(packet);
                view.setUint32(0, audioContext.sampleRate, true);
                new Int16Array(packet, 4).set(pcm16);

                socket.send(packet);
            };

            // Nur verarbeiten, NICHT an die eigenen Lautsprecher weiterleiten (verhindert Fiepen)
            micSource.connect(audioProcessor);
        }

        // 🔊 Spielt empfangenes Audio von anderen Handys ab
        function playIncomingPCM(arrayBuffer) {
            unlockAudio();
            if (!audioContext) return;

            try {
                const view = new DataView(arrayBuffer);
                const remoteSampleRate = view.getUint32(0, true);
                const int16 = new Int16Array(arrayBuffer, 4);

                const float32 = new Float32Array(int16.length);
                for (let i = 0; i < int16.length; i++) {
                    float32[i] = int16[i] / (int16[i] < 0 ? 0x8000 : 0x7FFF);
                }

                const audioBuffer = audioContext.createBuffer(1, float32.length, remoteSampleRate);
                audioBuffer.getChannelData(0).set(float32);

                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);

                const currentTime = audioContext.currentTime;
                if (nextPlayTime < currentTime) {
                    nextPlayTime = currentTime;
                }
                source.start(nextPlayTime);
                nextPlayTime += audioBuffer.duration;

            } catch (e) {
                console.error("Audio-Wiedergabefehler:", e);
            }
        }

        // Verbindung trennen
        function disconnect() {
            if (audioProcessor) {
                audioProcessor.disconnect();
                audioProcessor = null;
            }
            if (micSource) {
                micSource.disconnect();
                micSource = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            if (socket) {
                socket.close();
            }

            isConnected = false;
            btnWrapper.classList.remove('active');
            statusDot.className = "status-dot online";
            statusText.textContent = "Bereit";
            btnLabel.textContent = "VERBINDEN";
            nearbyCount.textContent = "0";
            nextPlayTime = 0;
        }

        // Haupt-Button Event
        talkBtn.addEventListener('click', async () => {
            unlockAudio();

            if (!isConnected) {
                try {
                    statusText.textContent = "Verbinde...";

                    mediaStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { 
                            echoCancellation: true, 
                            noiseSuppression: true,
                            autoGainControl: true
                        }, 
                        video: false 
                    });

                    connectToServer();

                    isConnected = true;
                    btnWrapper.classList.add('active');
                    statusDot.classList.remove('online');
                    statusDot.classList.add('active');
                    statusText.textContent = "LIVE";
                    btnLabel.textContent = "TRENNEN";

                } catch (err) {
                    console.error("Zugriff verweigert:", err);
                    alert("Bitte erlaube Zugriff auf Mikrofon und Standort.");
                    statusText.textContent = "Fehler";
                    statusDot.className = "status-dot";
                }
            } else {
                disconnect();
            }
        });

        // GPS-Berechtigung direkt beim Laden der Seite anfragen
        window.addEventListener('load', () => {
            statusDot.classList.add('online');

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => console.log("GPS ok"),
                    (err) => console.warn("GPS Berechtigung fehlt"),
                    { enableHighAccuracy: true }
                );
            }
        });
    </script>
</body>
</html>
