<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk-to-Me (Dauerfunk)</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        
        /* Start-Overlay um Browser-Blockade zu umgehen */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
        }
        #start-btn {
            padding: 20px 40px; font-size: 20px; font-weight: bold;
            background: #22c55e; color: white; border: none; border-radius: 50px;
            box-shadow: 0 0 20px #22c55e; cursor: pointer; margin-top: 20px;
        }

        .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; }
        .status-dot { width: 15px; height: 15px; background: #ef4444; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-dot.active { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        #log { margin-top: 20px; font-size: 13px; color: #94a3b8; text-align: left; height: 180px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Pflicht-Klick für Handys zum Freischalten von Sound -->
    <div id="start-overlay">
        <h2>Talk-to-Me Raum-Funk</h2>
        <p style="margin-top: 10px; color: #aaa;">Tippe auf Start, um Ton & Mikrofon zu aktivieren.</p>
        <button id="start-btn" onclick="initApp()">FUNK STARTEN</button>
    </div>

    <div class="card">
        <h2><span id="dot" class="status-dot"></span> 500m Dauerfunk</h2>
        <p id="status-text" style="margin-top: 10px; font-size: 14px;">Warte auf Start...</p>
        <div id="log"></div>
    </div>

    <script>
        const API_URL = "https://talk-to-me-spcc.onrender.com";
        const socket = io(API_URL, { transports: ['websocket', 'polling'] });
        let myLat = null;
        let myLon = null;
        let audioContext = null;

        function initApp() {
            // 1. AudioContext erzeugen (schaltet Ton auf iOS/Android frei)
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.resume();

            // Overlay ausblenden
            document.getElementById("start-overlay").style.display = "none";
            log("Starte GPS und Mikrofon...");

            startGPS();
            startMic();
        }

        function startGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        myLat = pos.coords.latitude;
                        myLon = pos.coords.longitude;
                        socket.emit('update_location', { lat: myLat, lon: myLon });
                        document.getElementById("dot").classList.add("active");
                        document.getElementById("status-text").innerText = "Dauerhaft LIVE";
                    },
                    (err) => { alert("GPS aktivieren!"); },
                    { enableHighAccuracy: true }
                );
            }
        }

        function startMic() {
            // Bestimme passendes Format für Android vs. iPhone
            let mimeType = 'audio/webm';
            if (!MediaRecorder.isTypeSupported('audio/webm')) {
                if (MediaRecorder.isTypeSupported('audio/mp4')) {
                    mimeType = 'audio/mp4';
                } else if (MediaRecorder.isTypeSupported('audio/aac')) {
                    mimeType = 'audio/aac';
                }
            }

            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    log(`Mikrofon aktiv (${mimeType})`);
                    const mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0 && socket.connected && myLat && myLon) {
                            const reader = new FileReader();
                            reader.readAsDataURL(event.data);
                            reader.onloadend = () => {
                                socket.emit('audio_stream', reader.result);
                            };
                        }
                    };

                    // Sendet alle 400ms Audio-Happen
                    mediaRecorder.start(400);
                })
                .catch(err => {
                    log("Fehler: Mikrofonzugriff verweigert!");
                });
        }

        // Live-Audio empfangen & abspielen
        socket.on('live_audio', (data) => {
            log(`🔊 Signal empfangen (${data.distance}m entfernt)`);
            
            const audio = new Audio(data.stream);
            audio.play().catch(e => {
                log("Ton-Blockade! Bitte einmal den Bildschirm berühren.");
            });
        });

        function log(msg) {
            const l = document.getElementById("log");
            l.innerHTML += `<div>> ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }
    </script>
</body>
</html>
