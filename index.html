<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk-to-Me Radar Walkie-Talkie</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            color: var(--accent-color);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            background-color: #334155;
            color: var(--text-muted);
        }

        .status-badge.connected {
            background-color: #065f46;
            color: #34d399;
        }

        .status-badge.error {
            background-color: #991b1b;
            color: #f87171;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .radar-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: radial-gradient(circle, #0f172a 0%, #020617 100%);
            border-radius: 50%;
            border: 2px solid #334155;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .radar-ring {
            position: absolute;
            border: 1px dashed rgba(59, 130, 246, 0.3);
            border-radius: 50%;
        }

        .radar-ring:nth-child(1) { width: 30%; height: 30%; }
        .radar-ring:nth-child(2) { width: 60%; height: 60%; }
        .radar-ring:nth-child(3) { width: 90%; height: 90%; }

        .radar-axis-x, .radar-axis-y {
            position: absolute;
            background-color: rgba(59, 130, 246, 0.15);
        }
        .radar-axis-x { width: 100%; height: 1px; }
        .radar-axis-y { width: 1px; height: 100%; }

        .radar-sweep {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 0;
            left: 50%;
            transform-origin: bottom left;
            background: conic-gradient(from 0deg at 0% 100%, rgba(59, 130, 246, 0.4) 0deg, transparent 60deg);
            animation: sweep 4s linear infinite;
        }

        @keyframes sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .user-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }

        .user-dot.me {
            background-color: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
            z-index: 10;
        }

        .user-dot.other {
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            z-index: 5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            text-align: center;
        }

        .stat-box {
            background-color: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-talk {
            height: 80px;
            border-radius: 50px;
            font-size: 1.3rem;
            background-color: #22c55e;
            color: white;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .btn-talk:active, .btn-talk.active {
            background-color: #15803d;
            transform: scale(0.98);
        }

        .btn-talk:disabled {
            background-color: #334155;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        .gps-info {
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Talk-to-Me</h1>
        <div id="connection-status" class="status-badge">Getrennt</div>
    </div>

    <div class="card">
        <div class="radar-container" id="radar">
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            <div class="radar-axis-x"></div>
            <div class="radar-axis-y"></div>
            <div class="radar-sweep"></div>
            <!-- Eigenes Symbol in der Mitte -->
            <div class="user-dot me" style="top: 50%; left: 50%;" title="Du"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="count-online">0</div>
                <div class="stat-label">Server Online</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="count-nearby">0</div>
                <div class="stat-label">In 500m Umkreis</div>
            </div>
        </div>
    </div>

    <div class="card controls">
        <input type="text" id="username" placeholder="Dein Name" value="Anonym">
        <button id="btn-connect" class="btn-primary" onclick="toggleConnection()">Verbinden</button>
        <button id="btn-talk" class="btn-talk" disabled>DRÜCKEN ZUM SPRECHEN</button>
        <div class="gps-info" id="gps-status">GPS Status: Inaktiv</div>
    </div>
</div>

<script>
    // Konfiguration
    const SERVER_URL = "wss://talk-to-me-spcc.onrender.com/ws";
    const MAX_RADAR_RADIUS_METERS = 500;

    let ws = null;
    let myClientId = 'user_' + Math.random().toString(36).substring(2, 9);
    let watchId = null;
    let currentLat = 0;
    let currentLng = 0;
    let audioContext = null;
    let mediaStream = null;
    let processor = null;

    // Stille Protokollierung (NUR in die Entwickler-Konsole)
    function log(msg) {
        console.log(`[App] ${msg}`);
    }

    function updateStatus(text, type) {
        const badge = document.getElementById('connection-status');
        badge.innerText = text;
        badge.className = 'status-badge ' + type;
    }

    function toggleConnection() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            disconnect();
        } else {
            connect();
        }
    }

    function connect() {
        log("Verbindung wird aufgebaut...");
        updateStatus("Verbinde...", "");

        ws = new WebSocket(SERVER_URL);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
            log("WebSocket Verbunden!");
            updateStatus("Verbunden", "connected");
            document.getElementById('btn-connect').innerText = "Trennen";
            document.getElementById('btn-connect').className = "btn-danger";
            document.getElementById('btn-talk').disabled = false;

            startGPS();
            initAudio();
        };

        ws.onmessage = (event) => {
            if (typeof event.data === "string") {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === "radar_update") {
                        document.getElementById('count-online').innerText = data.total_online || 0;
                        document.getElementById('count-nearby').innerText = data.nearby_users ? data.nearby_users.length : 0;
                        updateRadar(data.nearby_users || []);
                    }
                } catch (e) {
                    console.error("JSON Fehler:", e);
                }
            } else if (event.data instanceof ArrayBuffer) {
                playReceivedAudio(event.data);
            }
        };

        ws.onerror = (err) => {
            console.error("WebSocket Fehler:", err);
            updateStatus("Fehler", "error");
        };

        ws.onclose = () => {
            log("Verbindung getrennt.");
            updateStatus("Getrennt", "");
            document.getElementById('btn-connect').innerText = "Verbinden";
            document.getElementById('btn-connect').className = "btn-primary";
            document.getElementById('btn-talk').disabled = true;
            stopGPS();
            clearRadar();
        };
    }

    function disconnect() {
        if (ws) ws.close();
    }

    // GPS Handhabung
    function startGPS() {
        if ("geolocation" in navigator) {
            document.getElementById('gps-status').innerText = "GPS Status: Suche Signal...";
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLng = pos.coords.longitude;
                    document.getElementById('gps-status').innerText = "GPS Status: Aktiv (Echtzeit)";
                    document.getElementById('gps-status').style.color = "#34d399";
                    sendLocation();
                },
                (err) => {
                    document.getElementById('gps-status').innerText = "GPS Fehler: " + err.message;
                    document.getElementById('gps-status').style.color = "#f87171";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            document.getElementById('gps-status').innerText = "GPS nicht unterstützt";
        }
    }

    function stopGPS() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        document.getElementById('gps-status').innerText = "GPS Status: Inaktiv";
        document.getElementById('gps-status').style.color = "var(--text-muted)";
    }

    function sendLocation() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            const username = document.getElementById('username').value || "Anonym";
            const payload = {
                type: "location",
                client_id: myClientId,
                username: username,
                lat: currentLat,
                lng: currentLng
            };
            ws.send(JSON.stringify(payload));
        }
    }

    // Radar Zeichnen
    function updateRadar(users) {
        clearRadar();
        const radar = document.getElementById('radar');

        users.forEach(user => {
            // Skaliere Meter auf Prozentpunkte auf dem Radar (500m Max-Radius)
            const maxPx = radar.clientWidth / 2;
            const xPct = 50 + (user.x / MAX_RADAR_RADIUS_METERS) * 45; 
            const yPct = 50 - (user.y / MAX_RADAR_RADIUS_METERS) * 45;

            // Begrenzen, damit Dots auf dem Radar bleiben
            const clampedXPct = Math.max(5, Math.min(95, xPct));
            const clampedYPct = Math.max(5, Math.min(95, yPct));

            const dot = document.createElement('div');
            dot.className = 'user-dot other';
            dot.style.left = `${clampedXPct}%`;
            dot.style.top = `${clampedYPct}%`;
            dot.title = `${user.username} (${user.distance}m)`;

            radar.appendChild(dot);
        });
    }

    function clearRadar() {
        const dots = document.querySelectorAll('.user-dot.other');
        dots.forEach(d => d.remove());
    }

    // Audio / Walkie-Talkie Handhabung
    async function initAudio() {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        } catch (e) {
            console.error("AudioInit Fehler:", e);
        }
    }

    const talkBtn = document.getElementById('btn-talk');

    const startTalking = async (e) => {
        e.preventDefault();
        if (!ws || ws.readyState !== WebSocket.OPEN) return;

        talkBtn.classList.add('active');
        talkBtn.innerText = "SPRICHT...";

        try {
            if (audioContext && audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            const source = audioContext.createMediaStreamSource(mediaStream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);

            source.connect(processor);
            processor.connect(audioContext.destination);

            processor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                const inputData = e.inputBuffer.getChannelData(0);
                
                // Konvertiere Float32 Audio-Buffer in Int16 für PCM
                const pcmData = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                }
                ws.send(pcmData.buffer);
            };
        } catch (err) {
            console.error("Mikrofon Fehler:", err);
            stopTalking();
        }
    };

    const stopTalking = () => {
        talkBtn.classList.remove('active');
        talkBtn.innerText = "DRÜCKEN ZUM SPRECHEN";

        if (processor) {
            processor.disconnect();
            processor = null;
        }
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
    };

    talkBtn.addEventListener('mousedown', startTalking);
    talkBtn.addEventListener('mouseup', stopTalking);
    talkBtn.addEventListener('touchstart', startTalking);
    talkBtn.addEventListener('touchend', stopTalking);

    function playReceivedAudio(arrayBuffer) {
        if (!audioContext) return;

        const int16Array = new Int16Array(arrayBuffer);
        const float32Array = new Float32Array(int16Array.length);

        for (let i = 0; i < int16Array.length; i++) {
            float32Array[i] = int16Array[i] / 0x7FFF;
        }

        const buffer = audioContext.createBuffer(1, float32Array.length, 16000);
        buffer.getChannelData(0).set(float32Array);

        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        source.start();
    }
</script>

</body>
</html>
