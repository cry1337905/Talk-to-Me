<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk-to-Me (500m Live-Funk)</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #start-btn { padding: 20px 40px; font-size: 20px; font-weight: bold; background: #22c55e; color: white; border: none; border-radius: 50px; cursor: pointer; margin-top: 20px; box-shadow: 0 0 20px #22c55e; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; }
        .status-dot { width: 15px; height: 15px; background: #ef4444; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-dot.active { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        #log { margin-top: 20px; font-size: 13px; color: #94a3b8; text-align: left; height: 180px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h2>500m Live-Funkgerät</h2>
        <p style="margin-top: 10px; color: #aaa;">Tippe auf Start für direkte Tonverbindung</p>
        <button id="start-btn" onclick="initApp()">FUNK STARTEN</button>
    </div>

    <div class="card">
        <h2><span id="dot" class="status-dot"></span> Raum-Funk</h2>
        <p id="status-text" style="margin-top: 10px; font-size: 14px;">Warte auf Start...</p>
        <div id="log"></div>
    </div>

    <!-- Verstecktes Element zum Abspielen des empfangenen Sounds -->
    <audio id="remoteAudio" autoplay></audio>

    <script>
        const API_URL = "https://talk-to-me-spcc.onrender.com";
        const socket = io(API_URL, { transports: ['websocket', 'polling'] });
        let peer = null;
        let localStream = null;
        let myLat = null;
        let myLon = null;

        async function initApp() {
            document.getElementById("start-overlay").style.display = "none";
            log("Starte Mikrofon...");

            try {
                // Mikrofon-Stream holen
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                log("Mikrofon bereit.");

                // PeerJS Instanz mit zufälliger ID erstellen
                peer = new Peer();

                peer.on('open', (id) => {
                    log("Verbindungscode: " + id.substring(0, 5));
                    startGPS(id);
                });

                // Eingehende Live-Anrufe automatisch annehmen
                peer.on('call', (call) => {
                    log("🔊 Eingehendes Audio-Signal empfangen!");
                    call.answer(localStream);
                    
                    call.on('stream', (remoteStream) => {
                        const audio = document.getElementById("remoteAudio");
                        audio.srcObject = remoteStream;
                        audio.play();
                    });
                });

            } catch (err) {
                log("Mikrofon-Fehler: " + err);
            }
        }

        function startGPS(peerId) {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        myLat = pos.coords.latitude;
                        myLon = pos.coords.longitude;
                        
                        // Standort & Peer-ID an Server senden
                        socket.emit('register_peer', { peer_id: peerId, lat: myLat, lon: myLon });
                        
                        document.getElementById("dot").classList.add("active");
                        document.getElementById("status-text").innerText = "Dauerhaft LIVE (WebRTC)";
                    },
                    (err) => { alert("GPS aktivieren!"); },
                    { enableHighAccuracy: true }
                );
            }
        }

        // Andere Handys im 500m Radius automatisch anrufen
        socket.on('connect_to_peers', (data) => {
            if (!data.peers) return;
            
            data.peers.forEach(remotePeerId => {
                log("Verbinde direkt mit Gerät in der Nähe...");
                const call = peer.call(remotePeerId, localStream);
                
                call.on('stream', (remoteStream) => {
                    log("🔊 Audio-Stream verbunden!");
                    const audio = document.getElementById("remoteAudio");
                    audio.srcObject = remoteStream;
                    audio.play();
                });
            });
        });

        function log(msg) {
            const l = document.getElementById("log");
            l.innerHTML += `<div>> ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }
    </script>
</body>
</html>
