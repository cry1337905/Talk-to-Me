<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk-to-Me (500m Radar)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        #status { font-size: 12px; color: #00ff88; margin-top: 5px; }
        #chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2a2a2a; padding: 10px 14px; border-radius: 10px; max-width: 85%; }
        .dist { font-size: 10px; color: #aaa; margin-top: 4px; display: block; }
        #controls { display: flex; padding: 10px; background: #1f1f1f; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: none; outline: none; background: #333; color: white; }
        button { margin-left: 8px; padding: 10px 18px; border-radius: 20px; border: none; background: #007aff; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h2>Talk-to-Me (500m Umkreis)</h2>
        <div id="status">Suche GPS-Signal...</div>
    </header>

    <div id="chat"></div>

    <div id="controls">
        <input type="text" id="textInput" placeholder="Nachricht in die Umgebung senden...">
        <button onclick="sendMsg()">Senden</button>
    </div>

    <script>
        const API_URL = "https://talk-to-me-spcc.onrender.com";
        const myUserId = "User_" + Math.floor(Math.random() * 1000);
        let myLat = null;
        let myLon = null;

        // 1. GPS-Position vom Handy abfragen
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    myLat = pos.coords.latitude;
                    myLon = pos.coords.longitude;
                    document.getElementById("status").innerText = `GPS Aktiv | ID: ${myUserId}`;
                    updateLocationOnServer();
                },
                (err) => {
                    document.getElementById("status").innerText = "GPS-Fehler: Bitte Standort aktivieren!";
                },
                { enableHighAccuracy: true }
            );
        } else {
            alert("Dein Browser unterstützt kein Geolocation/GPS.");
        }

        async function updateLocationOnServer() {
            if (!myLat || !myLon) return;
            await fetch(`${API_URL}/update-location`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: myUserId, lat: myLat, lon: myLon })
            });
        }

        async function sendMsg() {
            const input = document.getElementById("textInput");
            const text = input.value.trim();
            if (!text || !myLat || !myLon) return;

            await fetch(`${API_URL}/send-message`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: myUserId, text: text, lat: myLat, lon: myLon })
            });

            input.value = "";
            fetchNearbyMessages();
        }

        async function fetchNearbyMessages() {
            if (!myLat || !myLon) return;

            try {
                const res = await fetch(`${API_URL}/get-nearby-messages`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ lat: myLat, lon: myLon })
                });

                const data = await res.json();
                const chat = document.getElementById("chat");
                chat.innerHTML = "";

                data.messages.forEach(m => {
                    const div = document.createElement("div");
                    div.className = "msg";
                    div.innerHTML = `<b>${m.user_id}</b>: ${m.text} <span class="dist">Entfernung: ca. ${m.distance_m}m</span>`;
                    chat.appendChild(div);
                });
            } catch (e) {
                console.error(e);
            }
        }

        // Alle 3 Sekunden nach neuen Nachrichten in der Umgebung suchen
        setInterval(fetchNearbyMessages, 3000);
    </script>
</body>
</html>
