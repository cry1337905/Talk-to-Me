<script>
    const RENDER_WEBSOCKET_URL = "wss://talk-to-me-spcc.onrender.com/ws";

    let myClientId = "user_" + Math.random().toString(36).substring(2, 9);
    let myUsername = "Anonym_" + Math.floor(Math.random() * 899 + 100);

    let isConnected = false;
    let socket = null;
    let audioContext = null;
    let audioProcessor = null;
    let mediaStream = null;
    let micSource = null;
    let nextPlayTime = 0;
    let watchId = null;
    let heartbeatInterval = null;

    let currentLat = 52.5200;
    let currentLng = 13.4050;

    let currentHeading = 0;
    let smoothedHeading = 0;
    let lastUserList = [];

    const nameModal = document.getElementById('nameModal');
    const usernameInput = document.getElementById('usernameInput');
    const startAppBtn = document.getElementById('startAppBtn');
    const talkBtn = document.getElementById('talkBtn');
    const btnLabel = document.getElementById('btnLabel');
    const totalOnlineCount = document.getElementById('totalOnlineCount');
    const nearbyCount = document.getElementById('nearbyCount');
    const userContainer = document.getElementById('userContainer');
    const radarBox = document.getElementById('radarBox');
    const gpsStatus = document.getElementById('gpsStatus');
    const compassHeadingVal = document.getElementById('compassHeadingVal');

    function log(msg) {
        console.log(msg);
    }

    startAppBtn.addEventListener('click', async () => {
        const name = usernameInput.value.trim();
        if (name.length > 0) {
            myUsername = name;
            nameModal.style.display = 'none';
            await requestCompassPermission();
        }
    });

    async function requestCompassPermission() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const permission = await DeviceOrientationEvent.requestPermission();
                if (permission === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                } else {
                    compassHeadingVal.textContent = "Gesperrt";
                }
            } catch (e) {
                console.error("iOS Kompass-Fehler:", e);
            }
        } else {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
    }

    function handleOrientation(event) {
        let heading = null;

        if (event.webkitCompassHeading) {
            heading = event.webkitCompassHeading; // iOS gibt echten Norden (0-360 deg)
        } else if (event.alpha !== null) {
            heading = 360 - event.alpha; // Android Fallback
        }

        if (heading !== null) {
            heading = (heading + 360) % 360;

            // Tiefpassfilter gegen Rauschen
            let diff = heading - smoothedHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            
            smoothedHeading = (smoothedHeading + diff * 0.2 + 360) % 360;
            currentHeading = smoothedHeading;
            compassHeadingVal.textContent = Math.round(currentHeading) + "°";

            if (lastUserList.length > 0) {
                updateRadarUI(lastUserList);
            }
        }
    }

    async function initAndUnlockAudio() {
        if (!audioContext) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioCtx();
        }
        if (audioContext.state === 'suspended') {
            await audioContext.resume();
        }
        const buffer = audioContext.createBuffer(1, 1, 22050);
        const source = audioContext.createBufferSource();
        source.buffer = buffer;
        source.connect(audioContext.destination);
        source.start(0);
    }

    function connectToServer() {
        userContainer.innerHTML = `<div style="font-size: 0.8rem; color: var(--accent-cyan); text-align: center;">Verbinde mit Server...</div>`;

        try {
            socket = new WebSocket(RENDER_WEBSOCKET_URL);
            socket.binaryType = "arraybuffer";

            socket.onopen = () => {
                userContainer.innerHTML = `<div style="font-size: 0.8rem; color: #10b981; text-align: center;">Verbunden! Sende Position...</div>`;
                
                dispatchLocation(currentLat, currentLng);
                
                heartbeatInterval = setInterval(() => {
                    dispatchLocation(currentLat, currentLng);
                }, 2000);

                startGPSWatch();
                startPCMStreaming();
            };

            socket.onmessage = (event) => {
                if (typeof event.data === "string") {
                    try {
                        const data = JSON.parse(event.data);
                        const onlineTotal = data.total_online ?? data.online_count ?? data.total ?? data.online ?? 1;
                        totalOnlineCount.textContent = String(onlineTotal);

                        const userList = data.nearby_users || data.users || data.clients || data.list || [];
                        updateRadarUI(userList);
                    } catch (e) {
                        log("JSON Parse-Fehler: " + e.message);
                    }
                } else if (event.data instanceof ArrayBuffer) {
                    playIncomingPCM(event.data);
                }
            };

            socket.onerror = () => log("WS-Fehler aufgetreten!");
            socket.onclose = () => { if (isConnected) disconnect(); };
        } catch (err) {
            log("Verbindungs-Fehler: " + err.message);
        }
    }

    function startGPSWatch() {
        if ("geolocation" in navigator) {
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    gpsStatus.textContent = "GPS Status: Aktiv (±" + Math.round(pos.coords.accuracy) + "m)";
                    gpsStatus.style.color = "#10b981";
                    currentLat = pos.coords.latitude;
                    currentLng = pos.coords.longitude;
                    dispatchLocation(currentLat, currentLng);
                },
                () => {
                    gpsStatus.textContent = "GPS eingeschränkt. Standardort genutzt.";
                    gpsStatus.style.color = "#ef4444";
                    dispatchLocation(currentLat, currentLng);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    }

    function dispatchLocation(lat, lng) {
        if (socket && socket.readyState === WebSocket.OPEN) {
            const payload = JSON.stringify({
                type: 'location',
                action: 'location',
                id: myClientId,
                client_id: myClientId,
                lat: parseFloat(lat),
                latitude: parseFloat(lat),
                lng: parseFloat(lng),
                longitude: parseFloat(lng),
                username: myUsername,
                name: myUsername
            });
            socket.send(payload);
        }
    }

    // Mathematische Peilung (Bearing) in Grad (0° = Nord, 90° = Ost)
    function calculateBearing(lat1, lon1, lat2, lon2) {
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;

        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
        const θ = Math.atan2(y, x);

        return (θ * 180 / Math.PI + 360) % 360;
    }

    // Haversine-Formel für exakte GPS-Distanz in Metern
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    function updateRadarUI(users) {
        if (!Array.isArray(users)) users = [];
        lastUserList = users;

        const otherUsers = users.filter(u => (u.id !== myClientId && u.client_id !== myClientId && u.username !== myUsername));

        nearbyCount.textContent = String(otherUsers.length);
        document.querySelectorAll('.radar-blip-container').forEach(el => el.remove());
        userContainer.innerHTML = '';

        if (otherUsers.length === 0) {
            userContainer.innerHTML = `<div style="font-size: 0.8rem; color: var(--text-secondary); text-align: center;">Keine anderen Personen in der Nähe.</div>`;
            return;
        }

        const radarRadiusPx = 130; // Pixel-Radius des Radars
        const maxDisplayDistance = 50; // In Metern (50m entspricht dem äußeren Radarring)

        otherUsers.forEach((user) => {
            const username = user.username || user.name || "User";
            
            let targetLat = parseFloat(user.lat ?? user.latitude);
            let targetLng = parseFloat(user.lng ?? user.longitude);

            let distance = calculateDistance(currentLat, currentLng, targetLat, targetLng);
            let bearing = calculateBearing(currentLat, currentLng, targetLat, targetLng);

            // FALLBACK BEI GPS-UNGENAUIGKEIT (< 2 Meter Differenz):
            // Falls beide Handys fast am selben Ort gemeldet werden, setzen wir versuchsweise 10m Abstand in Nord-Richtung,
            // damit du sehen kannst, ob die Radar-Drehung mit dem Kompass funktioniert.
            if (distance < 2 || isNaN(distance)) {
                distance = 10;
                bearing = 0; // Nord
            }

            const item = document.createElement('div');
            item.className = 'user-item';
            item.innerHTML = `<span class="user-name">${username}</span><span class="user-dist">${Math.round(distance)}m</span>`;
            userContainer.appendChild(item);

            // RELATIVER WINKEL:
            // Bearing minus Kompassausrichtung -> 0° bedeutet "Geradeaus vor dir"
            let relativeAngle = (bearing - currentHeading + 360) % 360;

            // In Radiant für JS Math
            let rad = (relativeAngle * Math.PI) / 180;

            // Skalierung auf Pixel-Radius
            let scaledDistance = Math.min(distance, maxDisplayDistance) / maxDisplayDistance * (radarRadiusPx - 15);

            // Polar-zu-Kartesisch Konvertierung:
            // 0° (Vorne) -> x = 0, y = -distance
            let pxX = scaledDistance * Math.sin(rad);
            let pxY = -scaledDistance * Math.cos(rad);

            const container = document.createElement('div');
            container.className = 'radar-blip-container';

            const blip = document.createElement('div');
            blip.className = 'radar-blip';

            const label = document.createElement('div');
            label.className = 'radar-blip-label';
            label.textContent = `${username} (${Math.round(distance)}m)`;

            container.appendChild(blip);
            container.appendChild(label);

            // Platzierung von der Mitte aus (130px, 130px)
            container.style.left = `${radarRadiusPx + pxX}px`;
            container.style.top = `${radarRadiusPx + pxY}px`;

            radarBox.appendChild(container);
        });
    }

    function startPCMStreaming() {
        if (!mediaStream || !audioContext) return;
        micSource = audioContext.createMediaStreamSource(mediaStream);
        audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);

        audioProcessor.onaudioprocess = (e) => {
            if (!isConnected || !socket || socket.readyState !== WebSocket.OPEN) return;
            const inputData = e.inputBuffer.getChannelData(0);
            const pcm16 = new Int16Array(inputData.length);
            for (let i = 0; i < inputData.length; i++) {
                let s = Math.max(-1, Math.min(1, inputData[i]));
                pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            const packet = new ArrayBuffer(4 + pcm16.length * 2);
            const view = new DataView(packet);
            view.setUint32(0, audioContext.sampleRate, true);
            new Int16Array(packet, 4).set(pcm16);
            socket.send(packet);
        };

        micSource.connect(audioProcessor);
        const dummyGain = audioContext.createGain();
        dummyGain.gain.value = 0;
        audioProcessor.connect(dummyGain);
        dummyGain.connect(audioContext.destination);
    }

    async function playIncomingPCM(arrayBuffer) {
        if (!audioContext) return;
        if (audioContext.state === 'suspended') await audioContext.resume();

        try {
            const view = new DataView(arrayBuffer);
            const remoteSampleRate = view.getUint32(0, true);
            const int16 = new Int16Array(arrayBuffer, 4);

            const float32 = new Float32Array(int16.length);
            for (let i = 0; i < int16.length; i++) {
                float32[i] = int16[i] / (int16[i] < 0 ? 0x8000 : 0x7FFF);
            }

            const audioBuffer = audioContext.createBuffer(1, float32.length, remoteSampleRate);
            audioBuffer.getChannelData(0).set(float32);

            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(audioContext.destination);

            const currentTime = audioContext.currentTime;
            if (nextPlayTime < currentTime) nextPlayTime = currentTime;
            source.start(nextPlayTime);
            nextPlayTime += audioBuffer.duration;
        } catch (e) {
            console.error("Audiofehler:", e);
        }
    }

    function disconnect() {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        if (heartbeatInterval !== null) clearInterval(heartbeatInterval);
        if (audioProcessor) { audioProcessor.disconnect(); audioProcessor = null; }
        if (micSource) { micSource.disconnect(); micSource = null; }
        if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
        if (socket) socket.close();

        isConnected = false;
        talkBtn.classList.remove('active');
        btnLabel.textContent = "VERBINDEN";
        totalOnlineCount.textContent = "0";
        nearbyCount.textContent = "0";
        userContainer.innerHTML = `<div style="font-size: 0.8rem; color: var(--text-secondary); text-align: center;">Getrennt</div>`;
        document.querySelectorAll('.radar-blip-container').forEach(el => el.remove());
    }

    talkBtn.addEventListener('click', async () => {
        await initAndUnlockAudio();

        if (!isConnected) {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true }, 
                    video: false 
                });

                isConnected = true;
                talkBtn.classList.add('active');
                btnLabel.textContent = "TRENNEN";

                connectToServer();

            } catch (err) {
                alert("Mikrofon-Zugriff erforderlich.");
            }
        } else {
            disconnect();
        }
    });
</script>
