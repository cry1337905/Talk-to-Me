<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk-to-Me (Dauerhafter Raum-Funk)</title>
    <!-- Socket.io Bibliothek für Live-Streaming -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .status-dot { width: 15px; height: 15px; background: #ef4444; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-dot.active { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        #log { margin-top: 20px; font-size: 13px; color: #94a3b8; text-align: left; height: 150px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2><span id="dot" class="status-dot"></span> 500m Dauerfunk</h2>
        <p id="status-text" style="margin-top: 10px; font-size: 14px;">Initalisiere...</p>
        
        <div id="log">
            <div>Warte auf Mikrofon-Freigabe...</div>
        </div>
    </div>

    <script>
        const API_URL = "https://talk-to-me-spcc.onrender.com";
        const socket = io(API_URL, { transports: ['websocket', 'polling'] });
        let myLat = null;
        let myLon = null;

        // 1. Verbindung zum Server herstellen
        socket.on('connect', () => {
            log("Am Server angemeldet.");
        });

        // 2. GPS durchgehend überwachen
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    myLat = pos.coords.latitude;
                    myLon = pos.coords.longitude;
                    socket.emit('update_location', { lat: myLat, lon: myLon });
                    document.getElementById("dot").classList.add("active");
                    document.getElementById("status-text").innerText = "Dauerhaft LIVE (Mikrofon aktiv)";
                },
                (err) => { alert("Bitte Standort/GPS aktivieren!"); },
                { enableHighAccuracy: true }
            );
        }

        // 3. Mikrofon DAUERHAFT öffnen und in Echtzeit absenden
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                log("Mikrofon aktiv. Du bist hörbar!");
                
                // Nutzt den MediaRecorder mit sehr kurzen Abschnitten (200ms) für Echtzeit-Streaming
                const mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0 && socket.connected && myLat && myLon) {
                        const reader = new FileReader();
                        reader.readAsDataURL(event.data);
                        reader.onloadend = () => {
                            // Sendet kleine Audio-Pakete alle 200 Millisekunden direkt weiter
                            socket.emit('audio_stream', reader.result);
                        };
                    }
                };

                // Alle 200 Millisekunden Audiodaten rausschicken (Quasi-Live-Stream)
                mediaRecorder.start(200);
            })
            .catch(err => {
                log("Fehler: Mikrofonzugriff verweigert!");
                alert("Mikrofon wird für den Dauerfunk benötigt.");
            });

        // 4. Live-Audio von Personen in der Nähe empfangen und sofort abspielen
        socket.on('live_audio', (data) => {
            log(`🔊 Höre ID ${data.sender_id} (${data.distance}m entfernt)`);
            const audio = new Audio(data.stream);
            audio.play().catch(e => console.log(e));
        });

        function log(msg) {
            const l = document.getElementById("log");
            l.innerHTML += `<div>> ${msg}</div>`;
            l.scrollTop = l.scrollHeight;
        }
    </script>
</body>
</html>
